; Pengaturan PHP untuk Web MIS Sekolah
upload_max_filesize = 5M
post_max_size       = 8M
memory_limit        = 128M
date.timezone       = Asia/Jakarta

; Sama seperti XAMPP: output ditahan dulu agar header()/session_start()
; tetap berjalan walau ada spasi/HTML sebelum kode PHP
output_buffering    = 4096

; Error tidak ditampilkan di halaman, tapi tercatat di log container
; (lihat dengan: docker compose logs -f web)
display_errors = Off
log_errors     = On
error_log      = /dev/stderr